<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Classdark</title><style>
:root{--bg:#ffffff;--fg:#111111;--brand:#0b6bcb}
html.dark{--bg:#0b0b14;--fg:#eeeeee;--brand:#6aa9ff}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 Helvetica,Arial,sans-serif}
main{max-width:900px;margin:0 auto;padding:48px}
.btn{display:inline-block;background:var(--brand);color:#fff;padding:12px 24px;border-radius:8px;text-decoration:none;margin-right:16px}
.toggle{float:right;padding:8px}
</style></head><body><main><button class="toggle" aria-label="Toggle theme" onclick="document.documentElement.classList.toggle('dark')">Theme</button>
<h1>Classdark</h1><p>Body copy for the class-toggled dark theme fixture.</p><p><a class="btn" href="/a">One</a><a class="btn" href="/b">Two</a><a class="btn" href="/c">Three</a></p></main></body></html>
